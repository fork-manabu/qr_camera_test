<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>HTML5-QRCode サンプル</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

    <h2>QRコードリーダー</h2>
    
    <!-- カメラ起動 / 停止ボタン -->
    <button id="start-btn" class="btn">カメラを起動する</button>
    

    <!-- モーダル & カメラ画面 -->
    <div class="p-qr-modal" id="modal">
        <div class="p-qr-modal__dialog">
            <button class="p-qr-modal__close-btn" id="close-btn" aria-label="閉じる">&times;</button>
            <div class="p-qr-reader">
                <div id="reader"></div>
            </div>
            <div id="result">
                <a
                    id="result-link"
                    class="p-qr-result-link is-disabled"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-disabled="true"
                >
                    ここに読み取り結果が表示されます
                </a>
            </div>
        </div>
    </div>
    <!-- モーダル & カメラ画面 -->

    <script src="assets/main.js"></script>
</body>
</html>
